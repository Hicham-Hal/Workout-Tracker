openapi: 3.0.3
info: 
  title: Workout Tracker API
  version: 1.0.0
  description: API for tracking workouts, exercises, and progress reports.
servers:
  - url: http://localhost:9000
    description: Local development server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Plan:
      type: object
      properties:
        _id:
          type: string
        owner:
          type: string
        title:
          type: string
        status:
          type: string
          enum: [pending, active, completed]
        scheduledAt:
          type: string
          format: date-time
        exercises:
          type: array
          items:
            type: object
            properties:
              exercise:
                type: string
              sets:
                type: integer
              reps:
                type: integer
              weight:
                type: number
        comments:
          type: array
          items:
            type: object
            properties: 
              _id:
                type: string
              comment:
                type: string
    User:
      type: object
      properties:
        _id:
          type: string
        username:
          type: string
        email:
          type: string
          format: email
paths: 
  /register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema: 
              type: object
              required: [username, email, password]
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 50
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
      responses:
        '201':
          description: Account created
          content: 
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  accessToken:
                    type: string
        '400':
          description: Missing or invalid fields
        '500':
          description: Server error
  /login:
    post:
      summary: Login an existing user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successfully
          content:
            application/json:
              schema: 
                type: object
                properties:
                  message:
                    type: string
                  accessToken:
                    type: string
        '400':
          description: Missing or invalid fields
        '401':
          description: Invalid email or password
        '500':
          description: Server error
  /plan/add:
    post:
      summary: Create a new workout plan
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, time, exercises]
              properties:
                title:
                  type: string
                time: 
                  type: string
                  format: date-time
                exercises:
                  type: array
                  items:
                    type: object
                    properties:
                      exercise:
                        type: string
                      sets: 
                        type: integer
                      reps:
                        type: integer
                      weight: 
                        type: number
      responses:
        '201':
          description: Plan created
          content: 
            application/json:
              schema:
                type: object
                properties:
                  newPlan:
                    $ref: '#/components/schemas/Plan'
        '400':
          description: Missing required fields
        '401':
          description: Missing or invalid access token
        '500':
          description: Server error
